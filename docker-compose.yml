services:
  server:
    image: manishsuriyal/sop-generator-server:latest
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - PORT=5000
      - CLIENT_URL=http://localhost

  client:
    image: manishsuriyal/sop-generator-client:latest
    ports:
      - "80:80"
    depends_on:
      - server